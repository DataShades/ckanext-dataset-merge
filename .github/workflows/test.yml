name: Tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        ckan-version: ["2.11", "2.12"]
      fail-fast: false

    name: CKAN ${{ matrix.ckan-version }}
    runs-on: ubuntu-latest
    container:
      image: ckan/ckan-dev:${{ matrix.ckan-version }}
      options: --user root
    services:
      solr:
        image: ckan/ckan-solr:${{ matrix.ckan-version }}-solr9
      postgres:
        image: ckan/ckan-postgres-dev:${{ matrix.ckan-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7

    env:
      CKAN_SQLALCHEMY_URL: postgresql://ckan_default:pass@postgres/ckan_test
      CKAN_DATASTORE_WRITE_URL: postgresql://datastore_write:pass@postgres/datastore_test
      CKAN_DATASTORE_READ_URL: postgresql://datastore_read:pass@postgres/datastore_test
      CKAN_SOLR_URL: http://solr:8983/solr/ckan
      CKAN_REDIS_URL: redis://redis:6379/1

    steps:
    - uses: actions/checkout@v4

    - name: Install requirements
      run: |
        pip install --upgrade pip
        # Runtime only needs plain ckanext-scheming, but most tests exercise the
        # optional `scheming_dynamic` path, which lives in the DataShades fork.
        # `ckanext-xloader` guards one regression test.
        pip install "ckanext-scheming[dynamic] @ git+https://github.com/DataShades/ckanext-scheming.git@dynamic-schemas"
        pip install ckanext-xloader
        pip install -e '.[dev]'

    - name: Setup extension
      run: |
        # Point test.ini at the CKAN core config shipped in the container.
        sed -i -e 's/use = config:.*/use = config:\/srv\/app\/src\/ckan\/test-core.ini/' test.ini
        ckan -c test.ini db init

    - name: Run tests
      run: pytest --ckan-ini=test.ini --cov=ckanext.dataset_merge --disable-warnings ckanext/dataset_merge

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
